# Render Blueprint — public host for Predictive Maintenance Analytics
# Deploy: https://dashboard.render.com/blueprints → New Blueprint Instance
# Repo: shaikmohammedshoaib666/predictive-maintenance-analytics
# Branch: main
# Full stack (LlamaIndex, Optuna, sklearn, Gemini) — use Render, not Streamlit Cloud.

services:
  - type: web
    name: predictive-maintenance-analytics
    runtime: python
    plan: free
    region: oregon
    branch: main
    buildCommand: pip install -r requirements.txt
    startCommand: bash start.sh
    healthCheckPath: /_stcore/health
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: STREAMLIT_BROWSER_GATHER_USAGE_STATS
        value: "false"
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.6-flash
      - key: MQTT_BROKER
        value: "127.0.0.1"
      - key: MQTT_PORT
        value: "1883"
      - key: MQTT_TOPIC
        value: "pdm/sensors/#"
      # Optional: paste exported cad_region_map.json (Render disk resets on redeploy).
      - key: CAD_MAP_JSON
        sync: false
