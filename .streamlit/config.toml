# Production defaults (Render / local)
# https://docs.streamlit.io/develop/concepts/configuration/options

[theme]
primaryColor = "#2563eb"
backgroundColor = "#ffffff"
secondaryBackgroundColor = "#f8fafc"
textColor = "#0f172a"
font = "sans serif"

[server]
headless = true
enableXsrfProtection = true
# Default is 200 MB. A 207 MB Rotax STEP must be able to upload.
maxUploadSize = 300

[browser]
gatherUsageStats = false

[client]
toolbarMode = "auto"
